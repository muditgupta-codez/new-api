server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # static assets
    location ~* \.(css|js|png|svg|ico|jpg|jpeg|webp|gif)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback: map clean paths to index.html (docs.js routes by pathname)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
